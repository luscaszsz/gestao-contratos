# Conexão com o PostgreSQL
quarkus.http.host=0.0.0.0
quarkus.http.port=8080

kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

mp.messaging.outgoing.contrato-validacao-solicitada.connector=smallrye-kafka
mp.messaging.outgoing.contrato-validacao-solicitada.topic=contrato.validacao.solicitada
mp.messaging.outgoing.contrato-validacao-solicitada.value.serializer=org.apache.kafka.common.serialization.StringSerializer

mp.messaging.incoming.contrato-validacao-resultado.connector=smallrye-kafka
mp.messaging.incoming.contrato-validacao-resultado.topic=contrato.validacao.resultado
mp.messaging.incoming.contrato-validacao-resultado.group.id=publica-contratos
mp.messaging.incoming.contrato-validacao-resultado.auto.offset.reset=earliest
mp.messaging.incoming.contrato-validacao-resultado.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

# PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:senha}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:meu_banco}

# Hibernate ORM
quarkus.hibernate-orm.schema-management.strategy=update

# Logs SQL (desenvolvimento)
%dev.quarkus.hibernate-orm.log.sql=true

quarkus.log.level=INFO
quarkus.log.category."org.hibernate".level=DEBUG