# Conexão com o PostgreSQL
quarkus.http.host=0.0.0.0
quarkus.http.port=8080

#api validacao
quarkus.rest-client.validacao-api.url=${VALIDACAO_URL:http://localhost:8081}

# PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:senha}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:meu_banco}

# Hibernate ORM
quarkus.hibernate-orm.schema-management.strategy=update

# Logs SQL (desenvolvimento)
%dev.quarkus.hibernate-orm.log.sql=true