# Conexão com o PostgreSQL
quarkus.http.host=0.0.0.0
quarkus.http.port=8080

# kafka configs

kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

mp.messaging.incoming.contrato-validacao-solicitada.connector=smallrye-kafka
mp.messaging.incoming.contrato-validacao-solicitada.topic=contrato.validacao.solicitada
mp.messaging.incoming.contrato-validacao-solicitada.group.id=valida-contratos
mp.messaging.incoming.contrato-validacao-solicitada.auto.offset.reset=earliest
mp.messaging.incoming.contrato-validacao-solicitada.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

mp.messaging.outgoing.contrato-validacao-resultado.connector=smallrye-kafka
mp.messaging.outgoing.contrato-validacao-resultado.topic=contrato.validacao.resultado
mp.messaging.outgoing.contrato-validacao-resultado.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# Hibernate ORM
quarkus.hibernate-orm.schema-management.strategy=update

# Logs SQL (desenvolvimento)
%dev.quarkus.hibernate-orm.log.sql=true

quarkus.log.level=INFO
quarkus.log.category."org.hibernate".level=INFO