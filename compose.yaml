
services:
  # Banco da consulta de contratos
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:-meu_banco}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-senha}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # API de consulta
  consulta-contratos:
    build:
      context: ./consulta-contratos
      dockerfile: src/main/docker/Dockerfile.jvm
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-meu_banco}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-senha}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  # API de validação
  valida-contrato:
    build:
      context: ./valida-contrato
      dockerfile: src/main/docker/Dockerfile.jvm
    ports:
      - "8081:8080"

  # Banco exclusivo da publicação
  postgres-publicacao:
    image: postgres:17
    environment:
      POSTGRES_DB: publicacao_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-senha}
    volumes:
      - publicacao_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d publicacao_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # API de publicação
  publica-contrato:
    build:
      context: ./publica-contrato
      dockerfile: src/main/docker/Dockerfile.jvm
    ports:
      - "8082:8080"
    environment:
      VALIDACAO_URL: http://valida-contrato:8080
      DB_HOST: postgres-publicacao
      DB_PORT: 5432
      DB_NAME: publicacao_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-senha}
    depends_on:
      valida-contrato:
        condition: service_started
      postgres-publicacao:
        condition: service_healthy

volumes:
  postgres_data:
  publicacao_data:
